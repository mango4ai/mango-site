<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="猫大刚主页 · 日拱一卒，功不唐捐">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.38" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="-0.15" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="400" rx="28" fill="url(#glow)"/>

  <!-- 装饰圆点 -->
  <circle cx="1430" cy="330" r="170" fill="#ffffff" opacity="0.08"/>
  <circle cx="1510" cy="80" r="90" fill="#ffffff" opacity="0.10"/>
  <circle cx="110" cy="60" r="60" fill="#ffffff" opacity="0.10"/>

  <text x="800" y="180" text-anchor="middle" fill="#ffffff"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="104" font-weight="800" letter-spacing="8"
        style="paint-order:stroke">猫大刚主页</text>

  <text x="800" y="258" text-anchor="middle" fill="#ffffff"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="52" font-weight="600" letter-spacing="6"
        opacity="0.97">日拱一卒，功不唐捐</text>

  <text x="800" y="330" text-anchor="middle" fill="#ffffff"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="26" font-weight="400" letter-spacing="1"
        opacity="0.85">写代码、读闲书、折腾硬件 —— 把学到的东西都留在这里</text>
</svg>
